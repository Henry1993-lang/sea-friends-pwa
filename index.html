<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f4d7a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>わたしのミニ水槽</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--u:4px;--sil:#04121f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:#0a3556;overscroll-behavior:none;touch-action:none;
  font-family:"Hiragino Sans","Noto Sans CJK JP","Noto Sans JP","Yu Gothic",Meiryo,sans-serif}
button{font-family:inherit;border:0;padding:0;margin:0;background:none;color:inherit;touch-action:manipulation}
svg{display:block}
#app{position:absolute;inset:0;overflow:hidden}
#bg{position:absolute;inset:0;background:linear-gradient(#6fd0f4 0%,#2f95d4 32%,#1a64a0 72%,#0e4270 100%);transition:background 1.2s}
body.night #bg{background:linear-gradient(#142a5e 0%,#0d1c45 50%,#071230 100%)}
.rays{position:absolute;inset:-20% 0 30% 0;opacity:.35;pointer-events:none;mix-blend-mode:screen}
.rays i{position:absolute;top:0;width:18vmax;height:140%;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0) 80%);transform-origin:50% 0;clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);animation:ray 9s ease-in-out infinite alternate}
.rays i:nth-child(1){left:6%;transform:rotate(14deg)}.rays i:nth-child(2){left:38%;animation-delay:-3s;transform:rotate(-6deg);width:12vmax}.rays i:nth-child(3){left:66%;animation-delay:-6s;transform:rotate(10deg)}
@keyframes ray{from{opacity:.3}to{opacity:1}}
body.night .rays{opacity:.08}
.stars{position:absolute;inset:0 0 50% 0;opacity:0;transition:opacity 1.2s;pointer-events:none}
body.night .stars{opacity:1}
.stars b{position:absolute;width:calc(var(--u)*.9);height:calc(var(--u)*.9);border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.scr{position:absolute;inset:0;overflow:hidden;animation:fin .35s ease-out}
@keyframes fin{from{opacity:0}to{opacity:1}}
.layer{position:absolute;inset:0;pointer-events:none}
.layer>*{pointer-events:auto}
#fx{position:absolute;inset:0;pointer-events:none;z-index:50;overflow:hidden}
/* ---- buttons ---- */
.rb{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(255,255,255,.18) 60%);border:calc(var(--u)*.7) solid rgba(255,255,255,.7);
  box-shadow:0 calc(var(--u)*1) calc(var(--u)*3) rgba(0,30,60,.35);z-index:20;cursor:pointer;transition:transform .12s}
.rb:active{transform:scale(.92)}
.rb svg{width:62%;height:62%}
.pad{padding:calc(var(--u)*2)}
#home .menu{position:absolute;inset:calc(var(--u)*3);display:grid;gap:calc(var(--u)*3);z-index:10}
#home.p .menu{grid-template-rows:repeat(var(--n),1fr);grid-template-columns:1fr;top:calc(var(--u)*17);bottom:calc(var(--u)*17)}
#home.l .menu{grid-template-columns:repeat(var(--n),1fr);grid-template-rows:1fr;top:calc(var(--u)*17);bottom:calc(var(--u)*13)}
.big{position:relative;border-radius:calc(var(--u)*8);cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:0 calc(var(--u)*1.4) 0 rgba(0,40,80,.35),0 calc(var(--u)*3) calc(var(--u)*5) rgba(0,30,60,.3);border:calc(var(--u)*.8) solid rgba(255,255,255,.75);transition:transform .12s}
.big:active{transform:scale(.96)}
.big svg{height:86%;width:86%;max-height:100%;filter:drop-shadow(0 calc(var(--u)*.8) calc(var(--u)*1) rgba(0,0,0,.25))}
.big.b1{background:linear-gradient(#7fe0ff,#2f9ad8)}
.big.b2{background:linear-gradient(#ffe39a,#f0a23a)}
.big.b3{background:linear-gradient(#c8f0b0,#4fbf8a)}
.big .sw{position:absolute;inset:0;animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--u)*-1.4))}}
/* ---- creatures ---- */
.cr{position:absolute;left:0;top:0;will-change:transform;cursor:pointer;touch-action:none}
.cr .fl{width:100%;height:100%;transition:transform .35s ease}
.cr .an{width:100%;height:100%;transform-origin:50% 60%}
.cr svg,.cell svg,.card svg{width:100%;height:100%;overflow:visible}
.cr .an.sw1{animation:swim1 1.6s ease-in-out infinite}
.cr .an.sw2{animation:swim2 2.6s ease-in-out infinite}
.cr .an.pulse{animation:jpulse 2.2s ease-in-out infinite}
.cr .an.sway{animation:sway 3s ease-in-out infinite}
.cr .an.crawl{animation:crawl 1.2s ease-in-out infinite}
.cr .an.slp{animation:slp 3.6s ease-in-out infinite}
.cr .an.react{animation:react .7s ease-out}
.cr .an.munch{animation:munch .35s ease-out}
.cr .an.wake{animation:react .7s ease-out}
@keyframes swim1{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(calc(var(--u)*-.8)) rotate(3deg)}}
@keyframes swim2{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(calc(var(--u)*-1.2)) scale(1.04,.96)}}
@keyframes jpulse{0%,100%{transform:scale(1,1) translateY(0)}40%{transform:scale(.92,1.1) translateY(calc(var(--u)*-1.5))}70%{transform:scale(1.04,.96)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes crawl{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(calc(var(--u)*-.4))}}
@keyframes slp{0%,100%{transform:scale(1,1) rotate(-6deg)}50%{transform:scale(1.04,.96) rotate(-4deg)}}
@keyframes react{0%{transform:scale(1)}20%{transform:scale(1.25,.8) translateY(calc(var(--u)*1))}45%{transform:scale(.88,1.2) translateY(calc(var(--u)*-5))}70%{transform:scale(1.08,.94)}100%{transform:scale(1)}}
@keyframes munch{0%{transform:scale(1)}30%{transform:scale(1.15,.88)}60%{transform:scale(.94,1.08)}100%{transform:scale(1)}}
.cr.rare svg{filter:hue-rotate(35deg) saturate(1.5) brightness(1.1) drop-shadow(0 0 calc(var(--u)*2) #ffe36b)}
.shiny svg{filter:hue-rotate(35deg) saturate(1.5) brightness(1.1) drop-shadow(0 0 calc(var(--u)*1.5) #ffe36b)}
body.night .cr svg{filter:brightness(.78) saturate(.9)}
body.night .cr.rare svg{filter:hue-rotate(35deg) saturate(1.5) drop-shadow(0 0 calc(var(--u)*2) #ffe36b)}
.zz{position:absolute;left:55%;top:-8%;width:34%;height:34%;pointer-events:none;animation:zzf 2.8s ease-in-out infinite;opacity:.9}
@keyframes zzf{0%{transform:translate(0,0) scale(.6);opacity:0}30%{opacity:1}100%{transform:translate(calc(var(--u)*3),calc(var(--u)*-5)) scale(1.1);opacity:0}}
.sil{--c:var(--sil)}
.sil *{opacity:1!important}
.sil .d{display:none}
.sil .ln{fill:none!important;stroke:var(--sil)!important}
.sil :not(.ln):not(g){fill:var(--sil)!important;stroke:none!important}
.sil.dim{--sil:#0a2540}
/* ---- fx ---- */
.bub{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95) 0 14%,rgba(255,255,255,.25) 40%,rgba(255,255,255,.12) 70%);border:1px solid rgba(255,255,255,.7);animation:rise var(--t,1.6s) ease-out forwards}
@keyframes rise{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx,0),var(--dy,-120px)) scale(1);opacity:0}}
.pt{position:absolute;pointer-events:none;animation:burst var(--t,1.1s) ease-out forwards}
.pt svg{width:100%;height:100%}
@keyframes burst{0%{transform:translate(0,0) scale(.2) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(1) rotate(var(--r,0deg));opacity:0}}
.rip{position:absolute;border-radius:50%;border:calc(var(--u)*.6) solid rgba(255,255,255,.8);pointer-events:none;animation:rip .8s ease-out forwards}
@keyframes rip{from{transform:translate(-50%,-50%) scale(.2);opacity:1}to{transform:translate(-50%,-50%) scale(1);opacity:0}}
/* ---- tank ---- */
.sandf{position:absolute;left:-5%;right:-5%;bottom:0;height:15%;background:linear-gradient(#e8d29c,#cfb06f);border-radius:50% 50% 0 0/22% 22% 0 0;pointer-events:none}
body.night .sandf{filter:brightness(.55)}
.weed{position:absolute;bottom:9%;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite;pointer-events:none}
.weed svg{width:100%;height:100%}
#foodb{left:50%;bottom:calc(var(--u)*3);width:calc(var(--u)*24);height:calc(var(--u)*24);margin-left:calc(var(--u)*-12);background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc83a 70%);border-color:#fff}
#foodb svg{width:78%;height:78%}
#foodb.off{filter:grayscale(.8) brightness(.9);opacity:.75}
.pel{position:absolute;width:calc(var(--u)*2.6);height:calc(var(--u)*2.6);border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd98a,#d9852c);box-shadow:0 0 0 1px rgba(120,60,0,.25);pointer-events:none}
/* ---- hide & seek ---- */
.sandbig{position:absolute;left:-5%;right:-5%;bottom:0;top:var(--st,42%);background:linear-gradient(#ecd7a2,#d2b374 60%,#c0a05f);border-radius:50% 50% 0 0/6% 6% 0 0}
body.night .sandbig{filter:brightness(.6)}
#holes{position:absolute;left:calc(var(--u)*4);right:calc(var(--u)*4);bottom:calc(var(--u)*6);top:var(--st2,50%);display:grid;align-items:end;justify-items:center;z-index:5;pointer-events:none}
.hole{position:relative;width:var(--hw);height:calc(var(--hw)*1.35);pointer-events:none}
.hole .win{position:absolute;left:0;right:0;top:0;bottom:calc(var(--hw)*.2);overflow:hidden;pointer-events:none}
.hole .bd{position:absolute;left:8%;right:8%;bottom:0;height:100%;transform:translateY(105%);transition:transform .55s cubic-bezier(.3,1.5,.5,1);pointer-events:auto;cursor:pointer;touch-action:none}
.hole .bd.up{transform:translateY(0)}
.hole .bd.up .an2{animation:sway 2.4s ease-in-out infinite;transform-origin:50% 100%}
.hole .bd.hop .an2{animation:hop .8s ease-out}
.hole .bd svg{width:100%;height:100%;overflow:visible}
@keyframes hop{0%{transform:translateY(0) rotate(0)}25%{transform:translateY(-14%) rotate(-10deg)}55%{transform:translateY(0) rotate(10deg)}100%{transform:translateY(0) rotate(0)}}
.hole .mound{position:absolute;left:-6%;right:-6%;bottom:0;height:calc(var(--hw)*.46);border-radius:50%;background:radial-gradient(ellipse at 50% 38%,#6b5530 0 26%,#d9bd82 27% 55%,#c9a966 70%);box-shadow:0 calc(var(--u)*.6) 0 rgba(120,90,40,.45);pointer-events:none}
.hole .ping{position:absolute;left:5%;right:5%;bottom:calc(var(--hw)*.04);height:calc(var(--hw)*.4);border-radius:50%;border:calc(var(--u)*.8) solid #fff6b0;opacity:0;pointer-events:none}
.hole .ping.on{animation:ping 1.1s ease-out infinite}
.hole .tap{position:absolute;left:0;right:0;bottom:0;height:calc(var(--hw)*.6);pointer-events:auto}
@keyframes ping{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.starsrow{position:absolute;left:0;right:0;top:calc(var(--u)*3);display:flex;gap:calc(var(--u)*2);justify-content:center;pointer-events:none;z-index:15}
.starsrow svg{width:calc(var(--u)*7);height:calc(var(--u)*7);opacity:.35;transition:all .3s}
.starsrow svg.on{opacity:1;transform:scale(1.2)}
/* ---- dokore ---- */
#cards{position:absolute;left:calc(var(--u)*3);right:calc(var(--u)*3);top:calc(var(--u)*18);bottom:calc(var(--u)*10);display:flex;gap:calc(var(--u)*3);z-index:10}
#cards.p{flex-direction:column}
#cards.l{flex-direction:row;top:calc(var(--u)*14);bottom:calc(var(--u)*13)}
.card{position:relative;flex:1;min-height:0;min-width:0;border-radius:calc(var(--u)*7);background:linear-gradient(rgba(255,255,255,.92),rgba(220,242,255,.85));
  border:calc(var(--u)*.9) solid #fff;box-shadow:0 calc(var(--u)*1.4) 0 rgba(0,50,90,.3),0 calc(var(--u)*3) calc(var(--u)*5) rgba(0,30,60,.25);padding:calc(var(--u)*2.5);cursor:pointer;transition:opacity .4s,transform .3s;touch-action:none}
.card .pic{width:100%;height:100%;animation:bob 3.4s ease-in-out infinite}
.card .pic .reveal{width:100%;height:100%}
.card.hint{animation:hint 1s ease-in-out infinite}
@keyframes hint{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,240,120,.0)}50%{transform:scale(1.04);box-shadow:0 0 0 calc(var(--u)*2.5) rgba(255,240,120,.85)}}
.card.shy{animation:shy .6s ease-out}
@keyframes shy{0%{transform:scale(1)}25%{transform:scale(.93) rotate(-2deg)}55%{transform:scale(1.03) rotate(2deg)}100%{transform:scale(1)}}
.card.win{animation:winc .9s ease-out;z-index:3}
@keyframes winc{0%{transform:scale(1)}30%{transform:scale(1.1) rotate(-2deg)}60%{transform:scale(.98) rotate(2deg)}100%{transform:scale(1.02)}}
.card.gone{opacity:.15;transform:scale(.9);pointer-events:none}
#pbtn{left:50%;top:calc(var(--u)*3);width:calc(var(--u)*13);height:calc(var(--u)*13);margin-left:calc(var(--u)*-6.5)}
/* ---- dex ---- */
#dgrid{position:absolute;left:0;right:0;top:calc(var(--u)*17);bottom:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--u)*26),1fr));gap:calc(var(--u)*2.5);padding:calc(var(--u)*2) calc(var(--u)*3) calc(var(--u)*8);align-content:start;-webkit-overflow-scrolling:touch}
.cell{aspect-ratio:1;border-radius:calc(var(--u)*5);background:rgba(255,255,255,.28);border:calc(var(--u)*.6) solid rgba(255,255,255,.55);padding:calc(var(--u)*2);cursor:pointer;position:relative}
.cell.got{background:linear-gradient(rgba(255,255,255,.9),rgba(215,240,255,.8))}
.cell.sh{border-color:#ffd54a;box-shadow:0 0 calc(var(--u)*2) #ffd54a}
.cell .st{position:absolute;right:calc(var(--u)*1);top:calc(var(--u)*1);width:calc(var(--u)*5);height:calc(var(--u)*5)}
.cell.pop{animation:react .7s ease-out}
#pbar{position:absolute;left:calc(var(--u)*22);right:calc(var(--u)*6);top:calc(var(--u)*6);height:calc(var(--u)*5);border-radius:99px;background:rgba(255,255,255,.3);border:calc(var(--u)*.6) solid rgba(255,255,255,.7);overflow:hidden}
#pbar i{display:block;height:100%;background:linear-gradient(90deg,#ffe36b,#ffb02e);border-radius:99px;transition:width .6s}
.dex-detail{position:absolute;inset:0;z-index:30;background:rgba(5,30,60,.55);display:flex;align-items:center;justify-content:center}
.dex-detail .dd{width:min(80vmin,90%);aspect-ratio:1;background:linear-gradient(#fff,#d8f0ff);border-radius:calc(var(--u)*9);padding:calc(var(--u)*5);animation:winc .9s ease-out;border:calc(var(--u)*1) solid #fff}
.dex-detail .dd .bg2{animation:bob 3s ease-in-out infinite;width:100%;height:100%}
/* ---- home extras ---- */
.daily{left:50%;top:calc(var(--u)*3);width:calc(var(--u)*17);height:calc(var(--u)*13);margin-left:calc(var(--u)*-8.5);border-radius:calc(var(--u)*6);background:rgba(255,255,255,.4);padding:calc(var(--u)*1)}
.daily svg.cs{height:100%;width:60%;margin:0 auto}
.daily .dots{position:absolute;left:0;right:0;bottom:calc(var(--u)*.6);display:flex;gap:calc(var(--u)*.8);justify-content:center}
.daily .dots i{width:calc(var(--u)*2);height:calc(var(--u)*2);border-radius:50%;background:rgba(255,255,255,.55)}
.daily .dots i.on{background:#ffd23f}
.daily .bigstar{position:absolute;right:calc(var(--u)*-2);top:calc(var(--u)*-2);width:calc(var(--u)*8);height:calc(var(--u)*8)}
/* ---- gate ---- */
#gate{position:fixed;right:0;bottom:0;width:calc(var(--u)*20);height:calc(var(--u)*20);z-index:1000;touch-action:none}
#gate svg{position:absolute;right:calc(var(--u)*2);bottom:calc(var(--u)*2);width:calc(var(--u)*12);height:calc(var(--u)*12);opacity:0;transition:opacity .2s;transform:rotate(-90deg)}
#gate.hold svg{opacity:1}
/* ---- rest ---- */
#rest{position:fixed;inset:0;z-index:900;background:radial-gradient(circle at 50% 35%,#1b2c63,#080f26 70%);opacity:0;pointer-events:none;transition:opacity 4s}
#rest.on{opacity:1;pointer-events:auto}
#rest.dark{background:#000;transition:background 20s}
#rest .moon{position:absolute;left:50%;top:22%;width:calc(var(--u)*30);height:calc(var(--u)*30);margin-left:calc(var(--u)*-15);animation:bob 6s ease-in-out infinite}
#rest .mrow{position:absolute;left:0;right:0;bottom:22%;display:flex;gap:calc(var(--u)*3);justify-content:center}
#rest .mrow div{width:calc(var(--u)*17);height:calc(var(--u)*17);animation:slp 5s ease-in-out infinite;opacity:.9}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:800;transition:opacity 3s}
/* ---- settings ---- */
#set{position:fixed;inset:0;z-index:2000;background:#f2f6f9;color:#1b2a36;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;display:none;font-size:16px;-webkit-user-select:text;user-select:text}
#set.on{display:block}
#set .in{max-width:640px;margin:0 auto;padding:12px 14px 80px}
#set h1{font-size:20px;margin:6px 0 2px}
#set h2{font-size:15px;margin:22px 0 8px;color:#0e4270;border-bottom:2px solid #cfe1ee;padding-bottom:4px}
#set .row{display:flex;align-items:center;gap:8px;padding:8px 0;flex-wrap:wrap}
#set .row label{flex:1;min-width:120px}
#set small,#set .note{color:#5a6c7a;font-size:12.5px;line-height:1.5}
#set .btn{background:#2a8fd0;color:#fff;border-radius:10px;padding:10px 14px;font-size:15px;min-height:44px;cursor:pointer}
#set .btn.sub{background:#dfeaf2;color:#1b2a36}
#set .btn.warn{background:#d0524a}
#set .btn.rec{background:#e0674f}
#set .btn.recing{background:#c62828;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.6}}
#set input[type=range]{flex:2;min-width:160px;height:36px}
#set input[type=checkbox]{width:24px;height:24px}
#set select{font-size:15px;padding:8px;border-radius:8px;border:1px solid #b9cbd8;min-height:40px;background:#fff}
#set .rrow{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid #e0e9ef}
#set .rrow .ic{width:34px;height:34px;flex:none}
#set .rrow .nm{flex:1;font-size:15px}
#set .rrow .nm i{font-style:normal;font-size:12px;color:#2a9d5c;margin-left:6px}
#set .rrow .btn{padding:6px 10px;min-height:38px;font-size:14px}
#set .top{position:sticky;top:0;background:#f2f6f9;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:8px 0}
#set .msg{background:#fff4d6;border:1px solid #f0d58a;padding:8px 10px;border-radius:8px;margin:6px 0;font-size:13.5px}

.cell .fv{position:absolute;left:4%;top:4%;width:26%;height:26%;pointer-events:none}.cell .fv svg{width:100%;height:100%}
.dex-detail .favb{position:absolute;right:calc(var(--u)*5);bottom:calc(var(--u)*6);width:calc(var(--u)*20);height:calc(var(--u)*20);border-radius:50%;border:calc(var(--u)*1) solid #fff;background:rgba(255,255,255,.55);padding:calc(var(--u)*3.5);filter:grayscale(1) opacity(.7)}
.dex-detail .favb.on{filter:none;background:#fff}.dex-detail .favb svg{width:100%;height:100%}

</style>
</head>
<body>
<div id="bg"></div>
<div id="app"></div>
<div id="fx"></div>
<div id="dim"></div>
<div id="rest"></div>

/* ---------- 保存データ ----------
   localStorage に schemaVersion 付きJSONで保存。変更のたびに即時書き込み(save)、
   visibilitychange(hidden)/pagehide/beforeunload でも書き込む。
   読み込みは項目ごとに検証し、壊れた値だけ初期値に戻す。直前の正常データ(.bak)も持つ。 */
const SCHEMA_VERSION=2;
const KEY='aquaMini.save', KEY_BAK='aquaMini.save.bak', KEY_LEGACY='aquaMini.v1', KEY_BAD='aquaMini.save.corrupt';
const DEF=()=>({schemaVersion:SCHEMA_VERSION,tank:['chin','kuma','madako'],tankState:{},fav:[],sp:{},qn:0,streak:0,qOk:0,hideFinds:0,recent:[],daily:{k:'',n:0,done:false},
  set:{vol:.6,tts:true,modes:{tank:true,hide:true,which:true},start:'home',diff:0,night:'auto',rest:true,restMin:30,wake:true,ambient:false}});
let S=DEF();
const isObj=o=>o&&typeof o==='object'&&!Array.isArray(o);
const num=(v,d,lo=-1e9,hi=1e9)=>(typeof v==='number'&&isFinite(v))?Math.max(lo,Math.min(hi,v)):d;
const int=(v,d,lo=0,hi=1e9)=>Math.round(num(v,d,lo,hi));
const bool=(v,d)=>typeof v==='boolean'?v:d;
const oneOf=(v,list,d)=>list.includes(v)?v:d;
/* 任意のJSON(古い版・壊れた値・取り込みファイル)から、安全な状態オブジェクトを作る */
function normalizeState(j){
  const d=DEF(); if(!isObj(j))return d;
  if(typeof j.schemaVersion==='number'&&j.schemaVersion>SCHEMA_VERSION){ /* 新しい版のデータ: 読める項目だけ使う */ }
  const o=d;
  if(Array.isArray(j.tank)){ const seen=new Set(); o.tank=j.tank.filter(id=>typeof id==='string'&&BY[id]&&!seen.has(id)&&seen.add(id)).slice(0,6); }
  else if(j.tank===undefined){ /* 既定 */ } 
  if(isObj(j.tankState)){ Object.keys(j.tankState).forEach(id=>{ const t=j.tankState[id]; if(BY[id]&&isObj(t))o.tankState[id]={x:num(t.x,.5,0,1),y:num(t.y,.4,0,1),eaten:int(t.eaten,0,0,3),sleepAt:num(t.sleepAt,0,0,4e12),at:num(t.at,0,0,4e12)}; }); }
  if(Array.isArray(j.fav))o.fav=[...new Set(j.fav.filter(id=>typeof id==='string'&&BY[id]))];
  if(isObj(j.sp)){ Object.keys(j.sp).forEach(id=>{ const t=j.sp[id]; if(BY[id]&&isObj(t))o.sp[id]={disc:bool(t.disc,false),seen:int(t.seen,0),ok:int(t.ok,0),box:int(t.box,0,0,5),due:int(t.due,0),shiny:bool(t.shiny,false)}; }); }
  o.qn=int(j.qn,0); o.streak=int(j.streak,0); o.qOk=int(j.qOk,0); o.hideFinds=int(j.hideFinds,0);
  if(Array.isArray(j.recent))o.recent=j.recent.filter(id=>typeof id==='string'&&BY[id]).slice(-12);
  if(isObj(j.daily))o.daily={k:typeof j.daily.k==='string'?j.daily.k.slice(0,20):'',n:int(j.daily.n,0,0,3),done:bool(j.daily.done,false)};
  if(isObj(j.set)){ const t=j.set,e=o.set;
    e.vol=num(t.vol,e.vol,0,1); e.tts=bool(t.tts,e.tts);
    if(isObj(t.modes)){ ['tank','hide','which'].forEach(k=>{ e.modes[k]=bool(t.modes[k],true); }); if(!e.modes.tank&&!e.modes.hide&&!e.modes.which)e.modes.tank=e.modes.hide=e.modes.which=true; }
    e.start=oneOf(t.start,['home','tank','hide','which'],'home'); e.diff=int(t.diff,0,0,4); e.night=oneOf(t.night,['auto','day','night'],'auto');
    e.rest=bool(t.rest,e.rest); e.restMin=int(t.restMin,30,5,240); e.wake=bool(t.wake,e.wake); e.ambient=bool(t.ambient,e.ambient); }
  return o;
}
const lsGet=k=>{ try{return localStorage.getItem(k)}catch(e){return null} };
const lsSet=(k,v)=>{ try{localStorage.setItem(k,v);return true}catch(e){return false} };
function parseSave(raw){ if(!raw)return null; try{ const j=JSON.parse(raw); return isObj(j)?j:null; }catch(e){ return null; } }
let loadInfo={from:'new'};
function loadState(){
  const main=lsGet(KEY), bak=lsGet(KEY_BAK), leg=lsGet(KEY_LEGACY);
  let j=parseSave(main), from='main';
  if(!j){ if(main){ lsSet(KEY_BAD,main); } /* 壊れた本体を退避 */
    j=parseSave(bak); from='bak';
    if(!j){ const l=parseSave(leg); if(l&&l.v===1){ j=l; from='legacy-v1'; } else { j=null; from=main||bak?'corrupt-reset':'new'; } } }
  S=j?normalizeState(j):DEF(); loadInfo={from,schema:j&&j.schemaVersion||(j&&j.v)||0};
  if(j&&from!=='main')writeNow(); }
let preSave=null; /* 水槽画面が登録: 生きものの位置・満腹状態をSに書き込む */
function serialize(){ if(preSave){ try{preSave()}catch(e){} } S.schemaVersion=SCHEMA_VERSION; S.savedAt=Date.now(); return JSON.stringify(S); }
function writeNow(){ const txt=serialize(); const prev=lsGet(KEY); if(prev&&parseSave(prev))lsSet(KEY_BAK,prev); const ok=lsSet(KEY,txt); lastSaveOk=ok; return ok; }
let lastSaveOk=true;
function save(){ writeNow(); }   /* 変更のたびに即時書き込み */
const flushSave=()=>{ writeNow(); };
window.addEventListener('pagehide',flushSave); window.addEventListener('beforeunload',flushSave);
document.addEventListener('visibilitychange',()=>{ if(document.hidden)flushSave(); });
/* 永続ストレージ(ブラウザが容量不足で勝手に消さないようにお願いする) */
const Persist={granted:null,supported:!!(navigator.storage&&navigator.storage.persist),est:null,
  async ask(){ try{ if(!this.supported)return; if(await navigator.storage.persisted()){this.granted=true;} else this.granted=await navigator.storage.persist(); if(navigator.storage.estimate)this.est=await navigator.storage.estimate(); }catch(e){ this.granted=false; } return this.granted; }};
Persist.ask(); addEventListener('pointerdown',()=>{ if(Persist.granted!==true)Persist.ask(); },{once:true,capture:true,passive:true});
const spOf=id=>S.sp[id]||(S.sp[id]={disc:false,seen:0,ok:0,box:0,due:0,shiny:false});
const discCount=()=>SPECIES.filter(s=>S.sp[s.id]&&S.sp[s.id].disc).length;
function discover(id,shiny){const st=spOf(id);const isNew=!st.disc;st.disc=true;if(shiny)st.shiny=true;save();return isNew}
const isFav=id=>FAV.has(id)||S.fav.includes(id);
loadState();

/* ---------- 録音保存 (IndexedDB) ---------- */
const DB={db:null,
  open(){return this.db?Promise.resolve(this.db):new Promise((res,rej)=>{try{const r=indexedDB.open('aquaMiniRec',1);r.onupgradeneeded=()=>r.result.createObjectStore('rec');r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  tx(mode,fn){return this.open().then(db=>new Promise((res,rej)=>{const t=db.transaction('rec',mode);const st=t.objectStore('rec');const rq=fn(st);t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}))},
  put(k,blob){return this.tx('readwrite',s=>s.put(blob,k))},
  get(k){return this.tx('readonly',s=>s.get(k))},
  del(k){return this.tx('readwrite',s=>s.delete(k))},
  keys(){return this.tx('readonly',s=>s.getAllKeys())},
  clear(){return this.tx('readwrite',s=>s.clear())}
};

const MAXGAIN=.55; // 音量の上限(スライダー100%でもこれ以上にならない) + コンプレッサ
const Snd={ctx:null,master:null,rec:new Set(),bufs:{},cur:null,last:{},
  init(){ if(this.ctx){ if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{}); return this.ctx; }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return null;
    try{ this.ctx=new AC(); const c=this.ctx.createDynamicsCompressor(); c.threshold.value=-18;c.ratio.value=8;c.attack.value=.003;c.release.value=.2;
      this.master=this.ctx.createGain(); this.setVol(S.set.vol); this.master.connect(c); c.connect(this.ctx.destination);}catch(e){this.ctx=null}
    return this.ctx; },
  setVol(v){ if(this.master)this.master.gain.value=clamp(v,0,1)*MAXGAIN; },
  tone(f,t0,d,type='sine',g=.3,slide=0,dest){ const c=this.ctx; if(!c)return; const o=c.createOscillator(),gn=c.createGain(); o.type=type; const t=c.currentTime+t0;
    o.frequency.setValueAtTime(f,t); if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
    gn.gain.setValueAtTime(0,t); gn.gain.linearRampToValueAtTime(g,t+Math.min(.02,d/3)); gn.gain.exponentialRampToValueAtTime(.0008,t+d);
    o.connect(gn); gn.connect(dest||this.master); o.start(t); o.stop(t+d+.05); },
  throttle(k,ms){const n=performance.now();if(this.last[k]&&n-this.last[k]<ms)return false;this.last[k]=n;return true},
  pop(){ if(!this.init()||!this.throttle('pop',60))return; this.tone(rand(500,700),0,.12,'sine',.28,2.2); },
  bubble(){ if(!this.init()||!this.throttle('bub',80))return; const f=rand(380,520); this.tone(f,0,.16,'sine',.22,2.4); this.tone(f*1.5,.05,.12,'sine',.12,2); },
  munch(){ if(!this.init()||!this.throttle('mun',140))return; this.tone(180,0,.07,'triangle',.3,.6); this.tone(150,.08,.07,'triangle',.25,.6); },
  sprinkle(){ if(!this.init())return; for(let i=0;i<6;i++)this.tone(rand(900,1600),i*.045,.07,'sine',.1,1.3); },
  boing(){ if(!this.init()||!this.throttle('boing',150))return; this.tone(260,0,.28,'sine',.3,1.9); this.tone(520,.05,.2,'triangle',.08,1.4); },
  blip(id){ if(!this.init()||!this.throttle('blip',120))return; const h=hashStr(id||'x'); const b=300+(h%9)*45; const t=['sine','triangle'][h%2];

  chime(n=3,base=523){ if(!this.init())return; const sc=[0,4,7,12,16,19]; for(let i=0;i<n;i++)this.tone(base*Math.pow(2,sc[i%6]/12),i*.11,.45,'sine',.26); },
  happy(){ if(!this.init())return; this.chime(4,587); this.tone(1175,.45,.5,'triangle',.1); },
  found(){ if(!this.init())return; [0,.12,.24].forEach((t,i)=>this.tone([660,830,990][i],t,.28,'triangle',.25,1.05)); },
  fanfare(){ if(!this.init())return; const n=[523,659,784,1047,784,1047,1319]; n.forEach((f,i)=>this.tone(f,i*.12,.35,'triangle',.22)); [0,.12,.24,.36].forEach((t,i)=>this.tone(2093+i*200,.9+t,.25,'sine',.07)); },
  rare(){ if(!this.init())return; for(let i=0;i<9;i++)this.tone(1000*Math.pow(1.122,i*1.5),i*.07,.35,'sine',.16); this.tone(523,0,1,'triangle',.08); },
  yawn(){ if(!this.init())return; this.tone(420,0,.6,'sine',.2,.5); },
  lullaby(){ if(!this.init())return; const n=[392,330,392,440,392,330,294,330,392,262]; n.forEach((f,i)=>this.tone(f,i*.62,.8,'sine',.18)); return n.length*.62; },
  /* 録音 */
  async loadRec(){ try{const k=await DB.keys(); this.rec=new Set(k);}catch(e){this.rec=new Set();} },
  has(k){ return this.rec.has(k); },
  async buf(k){ if(this.bufs[k])return this.bufs[k]; const b=await DB.get(k); if(!b)return null; const ab=await b.arrayBuffer();
    const buf=await new Promise((res,rej)=>{const p=this.ctx.decodeAudioData(ab,res,rej); if(p&&p.catch)p.catch(rej)}); this.bufs[k]=buf; return buf; },

const TTS={ok:'speechSynthesis' in window&&'SpeechSynthesisUtterance' in window,voice:null,
  pickVoice(){ if(!this.ok)return; const vs=speechSynthesis.getVoices()||[]; this.voice=vs.find(v=>/^ja[-_]JP/i.test(v.lang))||vs.find(v=>/^ja/i.test(v.lang))||null; },
  hasJa(){return this.ok&&!!this.voice}};
if(TTS.ok){TTS.pickVoice(); try{speechSynthesis.addEventListener('voiceschanged',()=>TTS.pickVoice())}catch(e){}}
let sayTok=0;
function stopVoice(){ sayTok++; Snd.stopRec(); try{TTS.ok&&speechSynthesis.cancel()}catch(e){} }
function speakTTS(text){ return new Promise(res=>{ if(!TTS.ok||!S.set.tts||!text)return res();
  try{ const u=new SpeechSynthesisUtterance(text); u.lang='ja-JP'; if(TTS.voice)u.voice=TTS.voice; u.rate=.85; u.pitch=1.25; u.volume=clamp(S.set.vol*1.3,0,1);
    let done=false; const fin=()=>{if(!done){done=true;res()}}; u.onend=fin; u.onerror=fin; setTimeout(fin,4500); speechSynthesis.speak(u);}catch(e){res()} }); }
/** parts: [{k:録音キー, t:代替の読み上げ}] 。連続する音声合成だけの部分は1文にまとめる */
async function say(parts){ if(!Snd.ctx&&!Snd.init()){} const tok=++sayTok; Snd.stopRec(); try{TTS.ok&&speechSynthesis.cancel()}catch(e){}
  await wait(40); if(tok!==sayTok)return;
  const seq=[]; for(const p of parts){ if(Snd.has(p.k))seq.push({rec:p.k}); else if(S.set.tts&&TTS.ok){const l=seq[seq.length-1]; if(l&&l.tts!=null)l.tts+='、'+p.t; else seq.push({tts:p.t});} }
  for(const s of seq){ if(tok!==sayTok)return; if(s.rec)await Snd.playRec(s.rec); else await speakTTS(s.tts); }
}

  clip(shape, inner){ const id='cp'+(++SV._u); return `<clipPath id="${id}">${shape}</clipPath><g class="d" clip-path="url(#${id})">${inner}</g>`; },

    let o=''; for(let k=0;k<n;k++){ const a=(a0+(a1-a0)*k/(n-1))*Math.PI/180, r=R*(k%2?0.86:1);

/* ---------- Swimmers: 泳ぐ生きもの + ごはん (水槽/ホーム共通) ---------- */
class Swimmers{
  constructor(layer,{food=false,onTapCr}={}){ this.layer=layer; this.list=[]; this.pels=[]; this.W=VW; this.H=VH; this.onTapCr=onTapCr; this.fedAny=false; this.sandFrac=.13; this.sleepAll=false; }
  resize(W,H){ this.W=W; this.H=H; this.list.forEach(c=>{ c.sz=this.sizeOf(c.sp); this.layout(c); }); }
  sizeOf(sp){ return Math.min(this.W,this.H)*.3*(SIZE[sp.id]||1)*(this.small||1); }
  floorY(c){ return this.H*(1-this.sandFrac*.62)-c.sz*.92; }
  layout(c){ c.el.style.width=c.el.style.height=c.sz+'px'; c.x=clamp(c.x,0,this.W-c.sz); if(c.kind==='sand'||c.kind==='bottom')c.y=this.floorY(c); else c.y=clamp(c.y,this.H*.04,this.floorY(c)); }
  add(id,at){ const sp=BY[id]; const c={sp,id,kind:kindOf(sp),sz:this.sizeOf(sp),fl:faceLeft(sp),sp_:speedOf(sp),vx:0,vy:0,eaten:0,sleepUntil:0,awakeUntil:0,tx:0,ty:0,nextT:0,dir:1,hide:0};
    const el=document.createElement('div'); el.className='cr'; el.innerHTML=`<div class="fl"><div class="an ${animOf(sp)}">${creatureSVG(sp)}</div></div>`; c.el=el; c.fl_=$('.fl',el); c.an=$('.an',el);
    const sh=S.sp[id]&&S.sp[id].shiny&&this.shiny; if(sh)el.classList.add('shiny');
    c.x=at?at.x:rand(0,this.W-c.sz); c.y=at?at.y:rand(this.H*.1,this.H*.6); this.layout(c);
    el.addEventListener('pointerdown',e=>{ e.stopPropagation(); this.tap(c,e) });
    this.layer.appendChild(el); this.list.push(c); this.newTarget(c); this.draw(c); return c; }
  remove(id){ const i=this.list.findIndex(c=>c.id===id); if(i<0)return; this.list[i].el.remove(); this.list.splice(i,1); }
  clear(){ this.list.forEach(c=>c.el.remove()); this.list=[]; this.pels.forEach(p=>p.el.remove()); this.pels=[]; }
  newTarget(c){ c.nextT=performance.now()+rand(2200,5200); if(c.kind==='sand'){c.tx=c.x;c.ty=c.y;return}
    c.tx=rand(0,this.W-c.sz); c.ty=c.kind==='bottom'?this.floorY(c):(c.kind==='float'?rand(this.H*.08,this.H*.55):rand(this.H*.06,this.floorY(c)-c.sz*.1)); }
  isSleeping(c,now){ if(now<c.awakeUntil)return false; return this.sleepAll||now<c.sleepUntil; }
  tap(c,e){ const now=performance.now(); const cx=c.x+c.sz/2,cy=c.y+c.sz/2; const sl=this.isSleeping(c,now);
    c.an.classList.remove('react','wake'); void c.an.offsetWidth; c.an.classList.add('react');
    FX.bubbles(cx,cy,sl?3:6,c.sz*.3); Snd.blip(c.id); if(sl){ c.awakeUntil=now+4500; Snd.yawn(); } else FX.burst(cx,cy-c.sz*.2,'heart',3,c.sz*.5);
    if(c.kind==='sand'){ c.hide=now+1100; } else { const a=rand(0,Math.PI*2); c.vx+=Math.cos(a)*this.W*.25; c.vy+=Math.sin(a)*this.H*.1; if(c.kind==='bottom')c.vy=0; }
    sayName(c.id); this.onTapCr&&this.onTapCr(c);
    if(!this.discOnce){} }
  feed(n=5){ const full=this.list.length&&this.list.every(c=>this.isSleeping(c,performance.now())); for(let i=0;i<n;i++){ if(this.pels.length>26)break; const el=document.createElement('div'); el.className='pel'; this.layer.appendChild(el);
      const p={el,x:rand(this.W*.12,this.W*.88),y:-rand(0,this.H*.12),ph:rand(0,6.28),rest:0,eaten:false}; this.pels.push(p);} return !full; }
  hungry(c,now){ return !this.isSleeping(c,now)&&c.eaten<3; }
  draw(c){ c.el.style.transform=`translate3d(${c.x.toFixed(1)}px,${(c.y+(c.hideOff||0)).toFixed(1)}px,0)`; }
  tick(dt,now){ const W=this.W,H=this.H;
    // pellets
    for(const p of this.pels){ if(p.rest){ if(now>p.rest+3500)p.dead=true; } else { p.y+=H*.12*dt; p.x+=Math.sin(now/600+p.ph)*8*dt; const fl=H*(1-this.sandFrac*.7); if(p.y>fl){p.y=fl;p.rest=now} } p.el.style.transform=`translate3d(${p.x}px,${p.y}px,0)`; if(p.dead){p.el.remove()} }
    this.pels=this.pels.filter(p=>!p.dead&&!p.eaten);
    for(const c of this.list){ const sl=this.isSleeping(c,now); const cx=c.x+c.sz/2,cy=c.y+c.sz/2; const spd=W*.09*c.sp_;
      if(c.sleepUntil&&now>=c.sleepUntil&&!this.sleepAll){ c.sleepUntil=0; c.eaten=0; this.zz(c,false); }
      if(sl){ if(!c.zzOn)this.zz(c,true); if(c.an.className.indexOf('slp')<0)c.an.className='an slp'; if(c.kind==='swim'||c.kind==='float'){ const fy=this.floorY(c)-c.sz*.05; c.vy+=(Math.sign(fy-c.y)*H*.05-c.vy)*Math.min(1,dt*2); if(Math.abs(fy-c.y)<4)c.vy=0; } c.vx*=1-Math.min(1,dt*3); }
      else { if(c.zzOn)this.zz(c,false); if(c.an.className.indexOf('slp')>=0){c.an.className='an '+animOf(c.sp);}
        // food chasing
        let tgt=null; if(this.pels.length&&this.hungry(c,now)&&c.kind!=='sand'){ let bd=1e9; for(const p of this.pels){ if(p.eaten)continue; const d=Math.hypot(p.x-cx,p.y-cy); if(d<bd){bd=d;tgt=p;} } }
        let dx,dy,s=spd;
        if(tgt){ dx=tgt.x-cx; dy=(c.kind==='bottom'?0:tgt.y-cy); s=spd*2.2; const d=Math.hypot(tgt.x-cx,tgt.y-cy); if(d<c.sz*.32){ tgt.eaten=true; tgt.el.remove(); c.eaten++; c.an.classList.remove('munch'); void c.an.offsetWidth; c.an.classList.add('munch'); Snd.munch(); FX.burst(cx,cy-c.sz*.1,'heart',2,c.sz*.4); FX.bubbles(cx,cy,2,10);
            if(c.eaten>=3){ c.sleepUntil=now+rand(35000,50000); c.awakeUntil=0; Snd.yawn(); } } }
        else { if(now>c.nextT||Math.hypot(c.tx-c.x,c.ty-c.y)<c.sz*.2)this.newTarget(c); dx=c.tx-c.x; dy=c.ty-c.y; }
        const L=Math.hypot(dx,dy)||1; let wvx=dx/L*s, wvy=dy/L*s; if(c.kind==='bottom'||c.kind==='sand'){wvy=0} if(c.kind==='float'){wvx*=.5;wvy*=.5}
        c.vx+=(wvx-c.vx)*Math.min(1,dt*1.6); c.vy+=(wvy-c.vy)*Math.min(1,dt*1.6); }
      if(c.kind==='sand'){c.vx=c.vy=0; c.hideOff=now<c.hide?c.sz*.75:0; }
      c.x+=c.vx*dt; c.y+=c.vy*dt; const fy=this.floorY(c);
      if(c.x<0){c.x=0;c.vx=Math.abs(c.vx)} if(c.x>W-c.sz){c.x=W-c.sz;c.vx=-Math.abs(c.vx)}
      if(c.kind==='bottom')c.y=fy; else if(c.kind!=='sand'){ if(c.y<H*.03){c.y=H*.03;c.vy=Math.abs(c.vy)} if(c.y>fy){c.y=fy;c.vy=-Math.abs(c.vy)*.3} }
      if(c.kind==='sand')c.y=fy;
      if(c.fl&&Math.abs(c.vx)>W*.012){ const flip=c.vx>0?-1:1; if(c.fkey!==flip){ c.fkey=flip; c.fl_.style.transform=`scaleX(${flip})`; } }
      this.draw(c); }
  }
  zz(c,on){ c.zzOn=on; const o=c.el.querySelector('.zz'); if(on&&!o){ const z=document.createElement('div'); z.className='zz'; z.innerHTML=IC.zzz; c.el.appendChild(z);} if(!on&&o)o.remove(); }
}

['pointerdown'].forEach(ev=>addEventListener(ev,e=>{ ptrs.set(e.pointerId,performance.now()); },{capture:true,passive:true}));
['pointerup','pointercancel'].forEach(ev=>addEventListener(ev,e=>{ ptrs.delete(e.pointerId); },{capture:true,passive:true}));

(function(){ const g=$('#gate'); g.innerHTML=IC.ring; const ring=$('#gring',g); let t0=0,raf=0,pid=null; const C=125.7;
  /* 右下の隅を「1本の指だけで」3秒長押し。ほかの指が触れたらキャンセル(手のひらが当たっても開かない) */
  const step=()=>{ if(pid===null)return; if(othersDown(pid)>0){ cancel(); return; } const p=Math.min(1,(performance.now()-t0)/3000); ring.style.strokeDashoffset=C*(1-p); if(p>=1){ cancel(); try{navigator.vibrate&&navigator.vibrate(40)}catch(e){} openSettings(); return; } if(performance.now()-t0>400)g.classList.add('hold'); raf=requestAnimationFrame(step); };
  const cancel=()=>{ cancelAnimationFrame(raf); g.classList.remove('hold'); ring.style.strokeDashoffset=C; pid=null; };
  g.addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); if(pid!==null||othersDown(e.pointerId)>0)return; pid=e.pointerId; try{g.setPointerCapture(e.pointerId)}catch(x){} t0=performance.now(); raf=requestAnimationFrame(step); });
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>g.addEventListener(ev,e=>{ if(e.pointerId===pid||ev==='lostpointercapture')cancel(); }));
  window.__gateCancel=cancel;
})();

  <p class="note">このページは、画面の右下の隅を3秒長押しすると開きます(お子さまには見えません)。</p>
  <h2>音量</h2><div class="row"><label>音の大きさ <small>(アプリ内で上限が決まっています。端末の音量も調整してください)</small></label><input type="range" min="0" max="100" value="${Math.round(st.vol*100)}" data-act="vol"><button class="btn sub" data-act="vtest">♪ ためす</button></div>

  <div class="row"><label><input type="checkbox" data-act="mode" data-m="hide" ${st.modes.hide?'checked':''}> かくれんぼ</label></div>
  <div class="row"><label><input type="checkbox" data-act="mode" data-m="which" ${st.modes.which?'checked':''}> どれかな?</label></div>
  <div class="row"><label>起動したときの画面</label><select data-act="start">${fmtOpt('home',st.start,'ホーム')}${fmtOpt('tank',st.start,'ミニ水槽')}${fmtOpt('hide',st.start,'かくれんぼ')}${fmtOpt('which',st.start,'どれかな?')}</select></div>
  <div class="row"><label>「どれかな?」のむずかしさ</label><select data-act="diff">${fmtOpt(0,st.diff,'おまかせ(だんだん難しく)')}${fmtOpt(1,st.diff,'1: 絵2つ')}${fmtOpt(2,st.diff,'2: 絵3つ')}${fmtOpt(3,st.diff,'3: かげ絵2つ')}${fmtOpt(4,st.diff,'4: かげ絵3つ')}</select></div>
  <div class="row"><label>夜モード</label><select data-act="night">${fmtOpt('auto',st.night,'自動(19時〜6時)')}${fmtOpt('day',st.night,'いつも昼')}${fmtOpt('night',st.night,'いつも夜')}</select></div>
  <h2>おやすみ演出</h2>
  <div class="row"><label><input type="checkbox" data-act="rest" ${st.rest?'checked':''}> 遊びが続くと、やさしく画面を暗くして「おやすみ」にする</label></div>

  <div class="row"><button class="btn warn" data-act="reset">進みぐあいをリセット</button><button class="btn sub" data-act="cleartank">水槽をからにする</button></div>
  <h2>バックアップ</h2><p class="note">進みぐあい・水槽・設定・録音を1つのファイル(JSON)に書き出せます。機種変更やデータ消去にそなえて、ときどき保存してください。${lastSaveOk?'':'<b>※いま保存に失敗しています(容量不足の可能性)。</b>'}</p>
  <div class="row"><button class="btn sub" data-act="export">バックアップを書き出す</button><button class="btn sub" data-act="import">バックアップを読み込む</button><input type="file" id="impfile" accept="application/json,.json" hidden></div>
  <h2>この端末で使える機能</h2><div class="note">${caps().map(([n,v])=>`${v?'✅':'⚠️'} ${n}`).join('<br>')}</div>
  <div class="row"><button class="btn sub" data-act="selftest">録音の保存・再生テスト</button></div>
  <p class="note">バージョン ${APP_VERSION} / 絵はすべて自作のSVG</p></div>`; setEl.scrollTop=sc; }
function openSettings(msg){ renderSet(msg); setEl.classList.add('on'); }
function closeSettings(){ stopRec(true); setEl.classList.remove('on'); save(); applyNight(); if(curName==='home'||curName==='tank'){ go(curName,null,true); } }
function rmsg(t){ const m=$('#recmsg',setEl); if(m)m.innerHTML=t?`<div class="msg">${t}</div>`:''; }
async function startRecFor(key,btn){ if(rec.mr)return; if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)||!window.MediaRecorder){ rmsg('このブラウザ/接続では録音できません。HTTPS(またはlocalhost)で開いているか、Chromeを使っているか確認してください。'); return; }
  try{ rec.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); }catch(e){ rmsg('マイクが使えません。ブラウザのマイク許可を確認してください ('+(e.name||'error')+')'); return; }
  const mimes=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus']; const mt=mimes.find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||'';
  const chunks=[]; rec.key=key; rec.mr=new MediaRecorder(rec.stream,mt?{mimeType:mt}:undefined); rec.mr.ondataavailable=e=>{ if(e.data&&e.data.size)chunks.push(e.data); };
  rec.mr.onstop=async()=>{ const k=rec.key; rec.stream&&rec.stream.getTracks().forEach(t=>t.stop()); const mr=rec.mr; rec.mr=null; rec.stream=null; clearTimeout(rec.timer); if(rec.cancel){rec.cancel=false; return;}
    const blob=new Blob(chunks,{type:mr.mimeType||mt||'audio/webm'}); if(blob.size<800){ renderSet('録音が短すぎました。もう一度どうぞ。'); return; }
    try{ await DB.put(k,blob); Snd.rec.add(k); Snd.dropBuf(k); renderSet(); setTimeout(()=>Snd.playRec(k),200); }catch(e){ renderSet('保存できませんでした: '+e); } };
  rec.mr.start(); rec.timer=setTimeout(()=>stopRec(),5000); btn.textContent='■ 停止'; btn.classList.add('recing'); }
function stopRec(cancel){ if(rec.mr&&rec.mr.state!=='inactive'){ rec.cancel=!!cancel; try{rec.mr.stop()}catch(e){} } }
async function selfTest(){ // 疑似音声(WAV)を保存→読み出し→デコード→再生
  const out=[]; try{ const sr=8000,n=sr/4,b=new ArrayBuffer(44+n*2),v=new DataView(b); const w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
    w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
    for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.sin(i/8*Math.PI)*8000,true); const blob=new Blob([b],{type:'audio/wav'});
    await DB.put('_selftest',blob); out.push('保存OK'); const got=await DB.get('_selftest'); out.push('読み出しOK ('+got.size+'B)'); Snd.init(); Snd.dropBuf('_selftest'); Snd.rec.add('_selftest'); const buf=await Snd.buf('_selftest'); out.push('デコードOK ('+buf.duration.toFixed(2)+'秒)'); await Snd.playRec('_selftest'); out.push('再生OK');
  }catch(e){ out.push('失敗: '+e); } try{ await DB.del('_selftest'); }catch(e){} Snd.rec.delete('_selftest'); Snd.dropBuf('_selftest'); return out.join(' / '); }
setEl.addEventListener('click',async e=>{ const t=e.target.closest('[data-act]'); if(!t)return; const a=t.dataset.act; const st=S.set;
  const row=t.closest('.rrow'); const key=row&&row.dataset.k;
  if(a==='close')closeSettings(); else if(a==='wakeup'){ endRest(); renderSet(); }
  else if(a==='vtest'){ Snd.init(); Snd.happy(); } else if(a==='ttest'){ say([{k:'_which',t:'チンアナゴは どれかな?'}]); }
  else if(a==='rec'){ if(rec.mr){ stopRec(); } else await startRecFor(key,t); }
  else if(a==='play'){ Snd.init(); if(Snd.has(key))Snd.playRec(key); else { const txt=PH[key]?PH[key].t:BY[key].name; speakTTS(txt); } }
  else if(a==='del'){ if(Snd.has(key)){ await DB.del(key); Snd.rec.delete(key); Snd.dropBuf(key); renderSet(); } }
  else if(a==='delrec'){ if(t.dataset.c){ await DB.clear(); Snd.rec=new Set(); Snd.bufs={}; renderSet('録音をすべて削除しました'); } else { t.dataset.c=1; t.textContent='もう一度押すと全部消えます'; } }
  else if(a==='reset'){ if(t.dataset.c){ const keep=S.set; S=DEF(); S.set=keep; save(); renderSet('進みぐあいをリセットしました'); } else { t.dataset.c=1; t.textContent='もう一度押すとリセット'; } }
  else if(a==='cleartank'){ S.tank=[]; save(); renderSet('水槽をからにしました'); }
  else if(a==='export'){ try{ const n=await exportBackup(); renderSet('書き出しました ('+n+'件の録音を含む)。ダウンロードフォルダを確認してください。'); }catch(err){ renderSet('書き出せませんでした: '+err); } }
  else if(a==='import'){ const f=$('#impfile',setEl); if(f){ f.value=''; f.click(); } }
  else if(a==='full'){ try{ await document.documentElement.requestFullscreen(); }catch(e){} }
  else if(a==='install'){ if(installEv){ installEv.prompt(); installEv=null; } }
  else if(a==='selftest'){ t.disabled=true; t.textContent='テスト中…'; const r=await selfTest(); renderSet('録音の保存・再生テスト: '+r); } });
/* ===== バックアップ(JSON。録音はBase64) ===== */
const b64FromBlob=b=>new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const s=String(r.result); res(s.slice(s.indexOf(',')+1)); }; r.onerror=()=>rej(r.error); r.readAsDataURL(b); });
const blobFromB64=(b64,type)=>{ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return new Blob([u],{type:type||'audio/webm'}); };
async function buildBackup(){ flushSave(); const recs={}; let keys=[]; try{ keys=(await DB.keys()).filter(k=>typeof k==='string'&&!k.startsWith('_selftest')); }catch(e){}
  for(const k of keys){ try{ const b=await DB.get(k); if(b&&b.size)recs[k]={type:b.type||'audio/webm',b64:await b64FromBlob(b)}; }catch(e){} }
  return {app:'mini-suisou',format:1,schemaVersion:SCHEMA_VERSION,appVersion:APP_VERSION,exportedAt:new Date().toISOString(),state:JSON.parse(serialize()),recordings:recs}; }
async function exportBackup(){ const bk=await buildBackup(); const blob=new Blob([JSON.stringify(bk)],{type:'application/json'}); const d=new Date(), p=n=>String(n).padStart(2,'0');
  const name=`mini-suisou-backup-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`;
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ a.remove(); URL.revokeObjectURL(a.href); },4000); return Object.keys(bk.recordings).length; }
async function importBackup(text){ let j; try{ j=JSON.parse(text); }catch(e){ throw new Error('ファイルが壊れています(JSONとして読めません)'); }
  if(!isObj(j)||j.app!=='mini-suisou'||!isObj(j.state))throw new Error('このアプリのバックアップではありません');
  const st=normalizeState(j.state); const recs=isObj(j.recordings)?j.recordings:{}; const valid=Object.keys(recs).filter(k=>isObj(recs[k])&&typeof recs[k].b64==='string'&&recs[k].b64.length>0&&(BY[k]||/^_[a-z0-9_]+$/i.test(k)));
  if(!confirm('いまの進みぐあい・録音をこのバックアップで置きかえます。よろしいですか?'))return null;
  const blobs={}; for(const k of valid){ try{ blobs[k]=blobFromB64(recs[k].b64,String(recs[k].type||'audio/webm').slice(0,60)); }catch(e){} }
  try{ const old=lsGet(KEY); if(old)lsSet(KEY_BAK,old); }catch(e){}
  try{ await DB.clear(); }catch(e){} for(const k of Object.keys(blobs)){ await DB.put(k,blobs[k]); }
  S=st; Snd.rec=new Set(Object.keys(blobs)); Snd.bufs={}; writeNow(); return Object.keys(blobs).length; }
setEl.addEventListener('change',async e=>{ const t=e.target; if(t.id!=='impfile'||!t.files||!t.files[0])return; const f=t.files[0];
  try{ if(f.size>60e6)throw new Error('ファイルが大きすぎます'); const n=await importBackup(await f.text()); if(n===null){ renderSet('読み込みをやめました'); return; } renderSet('読み込みました (録音'+n+'件)。'); go(curName,null,true); }catch(err){ renderSet('読み込めませんでした: '+(err.message||err)); } });
setEl.addEventListener('input',e=>{ const t=e.target; if(t.dataset.act==='vol'){ S.set.vol=t.value/100; Snd.setVol(S.set.vol); save(); } });
setEl.addEventListener('change',e=>{ const t=e.target; const a=t.dataset.act; if(!a)return; const st=S.set;
  if(a==='tts')st.tts=t.checked; else if(a==='mode'){ st.modes[t.dataset.m]=t.checked; if(!enabledModes().length){ st.modes[t.dataset.m]=true; t.checked=true; } }
  else if(a==='start')st.start=t.value; else if(a==='diff')st.diff=+t.value; else if(a==='night'){ st.night=t.value; nightOverride=null; applyNight(); }
  else if(a==='rest'){ st.rest=t.checked; activeSec=0; } else if(a==='restMin')st.restMin=+t.value; else if(a==='wake'){ st.wake=t.checked; t.checked?reqWake():relWake(); }
  save(); });
